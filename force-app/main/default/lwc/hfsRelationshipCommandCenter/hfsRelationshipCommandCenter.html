<template>
  <article class="command-center" aria-labelledby="command-center-title">
    <header class="hero">
      <div>
        <p class="eyebrow">North Star command center</p>
        <h1 id="command-center-title">Universal operations action plan</h1>
      </div>
      <span class="version">{uiVersionLabel}</span>
    </header>

    <template lwc:if={isLoading}>
      <section
        class="state-panel"
        data-testid="loading-view"
        aria-busy="true"
        aria-live="polite"
      >
        <lightning-spinner
          alternative-text="Loading North Star context"
          size="medium"
        ></lightning-spinner>
        <h2>Loading North Star context</h2>
        <p>{state.message}</p>
      </section>
    </template>

    <template lwc:elseif={isEmpty}>
      <section class="state-panel" data-testid="empty-view">
        <div class="state-icon" aria-hidden="true">0</div>
        <h2>{state.title}</h2>
        <p>{state.message}</p>
      </section>
    </template>

    <template lwc:elseif={isDenied}>
      <section
        class="state-panel state-panel_denied"
        data-testid="denied-view"
        role="alert"
      >
        <div class="state-icon" aria-hidden="true">!</div>
        <h2>{state.title}</h2>
        <p>{state.message}</p>
        <p class="correlation">Correlation: {state.correlationId}</p>
      </section>
    </template>

    <template lwc:elseif={isError}>
      <section
        class="state-panel state-panel_error"
        data-testid="error-view"
        role="alert"
      >
        <div class="state-icon" aria-hidden="true">!</div>
        <h2>{state.title}</h2>
        <p>{state.message}</p>
        <p class="correlation">
          {state.errorCode} | Correlation: {state.correlationId}
        </p>
        <lightning-button
          data-testid="retry-button"
          label="Retry"
          variant="brand"
          onclick={handleRetry}
        ></lightning-button>
      </section>
    </template>

    <template lwc:elseif={isReady}>
      <div data-testid="ready-view">
        <section class="case-banner" aria-labelledby="case-title">
          <div class="case-heading">
            <div>
              <p class="eyebrow">{state.case.externalKey}</p>
              <h2 id="case-title">{state.case.title}</h2>
              <p class="case-summary">{state.case.summary}</p>
            </div>
            <div class="badges" aria-label="Case status">
              <lightning-badge label={state.case.severity}></lightning-badge>
              <lightning-badge label={state.case.status}></lightning-badge>
            </div>
          </div>

          <dl class="case-metrics">
            <div>
              <dt>Manager owner</dt>
              <dd>{state.case.owner.name}</dd>
            </div>
            <div>
              <dt>Rush deadline</dt>
              <dd>
                <lightning-formatted-date-time
                  value={state.case.serviceDeadline}
                  year="numeric"
                  month="short"
                  day="2-digit"
                  hour="2-digit"
                  minute="2-digit"
                ></lightning-formatted-date-time>
              </dd>
            </div>
            <div>
              <dt>Next decision update</dt>
              <dd>
                <lightning-formatted-date-time
                  value={state.case.nextUpdateDue}
                  year="numeric"
                  month="short"
                  day="2-digit"
                  hour="2-digit"
                  minute="2-digit"
                ></lightning-formatted-date-time>
              </dd>
            </div>
            <div>
              <dt>Current role</dt>
              <dd>{state.userRole}</dd>
            </div>
          </dl>
        </section>

        <section class="panel" aria-labelledby="risk-pulse-heading">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Risk pulse</p>
              <h2 id="risk-pulse-heading">North Star operations signals</h2>
            </div>
          </div>
          <ul class="entity-grid" aria-label="Risk pulse cards">
            <template for:each={state.case.riskPulses} for:item="risk">
              <li key={risk.id}>
                <span class="entity-type">{risk.label}</span>
                <strong>{risk.status}</strong>
              </li>
            </template>
          </ul>
        </section>

        <template lwc:if={state.case.profileMappings}>
          <section
            class="panel"
            data-testid="profile-mapping-cards"
            aria-labelledby="profile-mapping-heading"
          >
            <div class="panel-heading">
              <div>
                <p class="section-kicker">Universal core</p>
                <h2 id="profile-mapping-heading">
                  {state.case.profile.activeProfile}
                </h2>
                <p class="profile-boundary">{state.case.profile.boundary}</p>
              </div>
              <span class="status-pill">{state.case.profile.displayName}</span>
            </div>
            <div class="mapping-grid">
              <template
                for:each={state.case.profileMappings}
                for:item="mapping"
              >
                <article key={mapping.id} class="mapping-card">
                  <span class="entity-type">{mapping.primitive}</span>
                  <h3>{mapping.issue}</h3>
                  <dl>
                    <div>
                      <dt>Hospital</dt>
                      <dd>{mapping.hospital}</dd>
                    </div>
                    <div>
                      <dt>Hotel</dt>
                      <dd>{mapping.hotel}</dd>
                    </div>
                    <div>
                      <dt>Airport</dt>
                      <dd>{mapping.airport}</dd>
                    </div>
                    <div>
                      <dt>Banking</dt>
                      <dd>{mapping.banking}</dd>
                    </div>
                    <div>
                      <dt>Supermarket</dt>
                      <dd>{mapping.supermarket}</dd>
                    </div>
                    <div>
                      <dt>Cruise</dt>
                      <dd>{mapping.cruise}</dd>
                    </div>
                  </dl>
                </article>
              </template>
            </div>
          </section>
        </template>

        <template lwc:if={showRestrictedNotice}>
          <div class="permission-notice" data-testid="restricted-notice">
            You can inspect the accessible case facts. Approval controls are not
            available for your current role.
          </div>
        </template>

        <template lwc:if={commandMessage}>
          <div
            class="command-feedback command-feedback_success"
            data-testid="command-success"
            role="status"
          >
            {commandMessage}
          </div>
        </template>

        <template lwc:if={commandError}>
          <div
            class="command-feedback command-feedback_error"
            data-testid="command-error"
            role="alert"
          >
            {commandError}
          </div>
        </template>

        <div class="workspace">
          <main class="primary-column">
            <section class="panel" aria-labelledby="relationship-heading">
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">Operations context</p>
                  <h2 id="relationship-heading">
                    Resource, partner, and capacity
                  </h2>
                </div>
                <span class="status-pill"
                  >{state.case.affectedRelationship.status}</span
                >
              </div>
              <div class="relationship-line">
                <strong>{state.case.affectedRelationship.subject}</strong>
                <span>{state.case.affectedRelationship.type}</span>
                <strong>{state.case.affectedRelationship.object}</strong>
              </div>
              <ul class="entity-grid" aria-label="Connected entities">
                <template
                  for:each={state.case.connectedEntities}
                  for:item="entity"
                >
                  <li key={entity.id}>
                    <span class="entity-type">{entity.type}</span>
                    <strong>{entity.label}</strong>
                    <span>{entity.role}</span>
                  </li>
                </template>
              </ul>
              <dl class="case-metrics">
                <div>
                  <dt>Organization</dt>
                  <dd>{state.case.operationsContext.organization}</dd>
                </div>
                <div>
                  <dt>Resource</dt>
                  <dd>{state.case.operationsContext.resource}</dd>
                </div>
                <div>
                  <dt>Operational focus</dt>
                  <dd>{state.case.operationsContext.operationalFocus}</dd>
                </div>
                <div>
                  <dt>Operations window</dt>
                  <dd>{state.case.operationsContext.recoveryWindow}</dd>
                </div>
              </dl>
              <ul class="entity-grid" aria-label="Resource positions">
                <template
                  for:each={state.case.resourcePositions}
                  for:item="resource"
                >
                  <li key={resource.id}>
                    <span class="entity-type">{resource.label}</span>
                    <strong>{resource.value}</strong>
                  </li>
                </template>
              </ul>
            </section>

            <section class="panel" aria-labelledby="complaint-heading">
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">Customer trust</p>
                  <h2 id="complaint-heading">Complaint cluster</h2>
                </div>
              </div>
              <dl class="case-metrics">
                <div>
                  <dt>Type</dt>
                  <dd>{state.case.complaintCluster.type}</dd>
                </div>
                <div>
                  <dt>Count</dt>
                  <dd>{state.case.complaintCluster.count}</dd>
                </div>
                <div>
                  <dt>Partner</dt>
                  <dd>{state.case.complaintCluster.partner}</dd>
                </div>
                <div>
                  <dt>Window</dt>
                  <dd>{state.case.complaintCluster.window}</dd>
                </div>
              </dl>
              <template lwc:if={state.case.inboundComplaintIntake}>
                <div class="outcome" data-testid="inbound-complaint-intake">
                  <div>
                    <span class="entity-type">WhatsApp intake</span>
                    <h3>{state.case.inboundComplaintIntake.sourceChannel}</h3>
                  </div>
                  <p>{state.case.inboundComplaintIntake.summary}</p>
                  <strong
                    >{state.case.inboundComplaintIntake.protectedActionState}</strong
                  >
                </div>
                <div class="evidence-list evidence-list_compact">
                  <article class="evidence-card">
                    <h3>Follow-up questions</h3>
                    <ul class="fact-list">
                      <template
                        for:each={state.case.inboundComplaintIntake.followUpQuestions}
                        for:item="question"
                      >
                        <li key={question}>{question}</li>
                      </template>
                    </ul>
                  </article>
                  <article class="evidence-card">
                    <h3>Root-cause hypotheses</h3>
                    <ul class="inference-list">
                      <template
                        for:each={state.case.inboundComplaintIntake.rootCauseHypotheses}
                        for:item="hypothesis"
                      >
                        <li key={hypothesis}>{hypothesis}</li>
                      </template>
                    </ul>
                  </article>
                  <article class="evidence-card">
                    <h3>Next evidence needed</h3>
                    <ul class="fact-list">
                      <template
                        for:each={state.case.inboundComplaintIntake.nextEvidenceNeeded}
                        for:item="evidence"
                      >
                        <li key={evidence}>{evidence}</li>
                      </template>
                    </ul>
                  </article>
                </div>
              </template>
            </section>

            <section class="panel" aria-labelledby="supplier-heading">
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">Partner</p>
                  <h2 id="supplier-heading">Partner response</h2>
                </div>
                <span class="status-pill"
                  >{state.case.partnerResponse.status}</span
                >
              </div>
              <dl class="case-metrics">
                <div>
                  <dt>Lead time</dt>
                  <dd>{state.case.partnerResponse.responseDelay}</dd>
                </div>
                <div>
                  <dt>Replacement</dt>
                  <dd>{state.case.partnerResponse.recoveryOption}</dd>
                </div>
                <div>
                  <dt>Financial impact</dt>
                  <dd>{state.case.partnerResponse.financialImpact}</dd>
                </div>
                <div>
                  <dt>Boundary</dt>
                  <dd>{state.case.partnerResponse.boundary}</dd>
                </div>
              </dl>
            </section>

            <template lwc:if={state.case.orchestrationConflicts}>
              <section class="panel" aria-labelledby="conflicts-heading">
                <div class="panel-heading">
                  <div>
                    <p class="section-kicker">Orchestration</p>
                    <h2 id="conflicts-heading">
                      Conflicts before orchestration
                    </h2>
                  </div>
                </div>
                <ul class="action-list">
                  <template
                    for:each={state.case.orchestrationConflicts}
                    for:item="conflict"
                  >
                    <li key={conflict.id}>
                      <div>
                        <strong>{conflict.agent}</strong>
                        <span>{conflict.conflict}</span>
                        <span>{conflict.resolution}</span>
                      </div>
                    </li>
                  </template>
                </ul>
              </section>
            </template>

            <template lwc:if={state.case.agentHandoffTrace}>
              <section
                class="panel"
                data-testid="agent-handoff-trace"
                aria-labelledby="handoff-heading"
              >
                <div class="panel-heading">
                  <div>
                    <p class="section-kicker">Agent handoff</p>
                    <h2 id="handoff-heading">10-agent coordination trace</h2>
                  </div>
                </div>
                <ul class="action-list">
                  <template
                    for:each={state.case.agentHandoffTrace}
                    for:item="handoff"
                  >
                    <li key={handoff.id}>
                      <div>
                        <strong>{handoff.agent}</strong>
                        <span>{handoff.contribution}</span>
                        <span>Output: {handoff.output}</span>
                      </div>
                    </li>
                  </template>
                </ul>
              </section>
            </template>

            <template lwc:if={state.case.recommendationUpdates}>
              <section class="panel" aria-labelledby="updates-heading">
                <div class="panel-heading">
                  <div>
                    <p class="section-kicker">Recommendation update</p>
                    <h2 id="updates-heading">
                      Partner and capacity response changed the plan
                    </h2>
                  </div>
                </div>
                <ul class="action-list">
                  <template
                    for:each={state.case.recommendationUpdates}
                    for:item="update"
                  >
                    <li key={update.id}>
                      <div>
                        <strong>{update.trigger}</strong>
                        <span>{update.before}</span>
                        <span>{update.after}</span>
                        <span>Evidence: {update.evidence}</span>
                      </div>
                    </li>
                  </template>
                </ul>
              </section>
            </template>

            <section class="panel" aria-labelledby="timeline-heading">
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">Evidence timeline</p>
                  <h2 id="timeline-heading">Source records</h2>
                </div>
              </div>
              <ol class="timeline">
                <template for:each={state.case.timeline} for:item="item">
                  <li key={item.id}>
                    <div class="timeline-marker" aria-hidden="true"></div>
                    <div class="timeline-content">
                      <div class="timeline-meta">
                        <span>{item.type}</span>
                        <lightning-formatted-date-time
                          value={item.occurredAt}
                          hour="2-digit"
                          minute="2-digit"
                        ></lightning-formatted-date-time>
                      </div>
                      <h3>{item.title}</h3>
                      <p>{item.detail}</p>
                      <span class="source">{item.source}</span>
                    </div>
                  </li>
                </template>
              </ol>
            </section>

            <section class="panel" aria-labelledby="evidence-heading">
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">Provenance</p>
                  <h2 id="evidence-heading">Accessible source evidence</h2>
                </div>
              </div>
              <div class="evidence-list">
                <template for:each={state.case.evidence} for:item="evidence">
                  <article key={evidence.id} class="evidence-card">
                    <h3>{evidence.label}</h3>
                    <p>{evidence.summary}</p>
                    <dl>
                      <div>
                        <dt>Source</dt>
                        <dd>{evidence.sourceUri}</dd>
                      </div>
                      <div>
                        <dt>Captured</dt>
                        <dd>
                          <lightning-formatted-date-time
                            value={evidence.capturedAt}
                            year="numeric"
                            month="short"
                            day="2-digit"
                            hour="2-digit"
                            minute="2-digit"
                          ></lightning-formatted-date-time>
                        </dd>
                      </div>
                    </dl>
                    <code>{evidence.contentHash}</code>
                  </article>
                </template>
              </div>
            </section>

            <section class="panel" aria-labelledby="actions-heading">
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">Execution</p>
                  <h2 id="actions-heading">Operations tasks and channel log</h2>
                </div>
              </div>
              <ul class="action-list">
                <template for:each={state.case.actions} for:item="action">
                  <li key={action.id}>
                    <div>
                      <strong>{action.type}</strong>
                      <span>{action.sourceSystem}</span>
                    </div>
                    <span class="status-pill">{action.status}</span>
                  </li>
                </template>
              </ul>
              <div class="outcome">
                <div>
                  <span class="entity-type">Execution plan</span>
                  <h3>
                    {state.case.operationsExecution.primaryRecommendation}
                  </h3>
                </div>
              </div>
              <ul class="action-list">
                <template
                  for:each={state.case.operationsExecution.tasks}
                  for:item="task"
                >
                  <li key={task.id}>
                    <div>
                      <strong>{task.label}</strong>
                      <span>{task.owner}</span>
                    </div>
                    <span class="status-pill">{task.status}</span>
                  </li>
                </template>
              </ul>
              <ul class="action-list">
                <template for:each={state.case.channelLog} for:item="channel">
                  <li key={channel.id}>
                    <div>
                      <strong>{channel.channel}</strong>
                      <span>{channel.detail}</span>
                    </div>
                    <span class="status-pill">{channel.status}</span>
                  </li>
                </template>
              </ul>
              <div class="outcome">
                <div>
                  <span class="entity-type">Outcome</span>
                  <h3>{state.case.outcome.status}</h3>
                </div>
                <p>{state.case.outcome.summary}</p>
                <strong>{state.case.outcome.effectiveness}</strong>
              </div>
              <ul class="entity-grid" aria-label="Outcome metrics">
                <template
                  for:each={state.case.outcomeMetrics}
                  for:item="metric"
                >
                  <li key={metric.id}>
                    <span class="entity-type">{metric.label}</span>
                    <strong>{metric.value}</strong>
                  </li>
                </template>
              </ul>
            </section>
          </main>

          <aside class="secondary-column" aria-label="Decision controls">
            <section class="panel sticky-panel" aria-labelledby="sop-heading">
              <p class="section-kicker">Operating procedure</p>
              <h2 id="sop-heading">{state.case.sop.name}</h2>
              <div class="sop-meta">
                <span>Version {state.case.sop.version}</span>
                <span>{state.case.sop.status}</span>
              </div>
              <lightning-progress-bar
                value={state.case.sop.progress}
                size="large"
              ></lightning-progress-bar>
              <p class="progress-label">
                {state.case.sop.completedSteps} of {state.case.sop.totalSteps}
                steps complete
              </p>
              <div class="current-step">
                <span>Current step</span>
                <strong>{state.case.sop.currentStep}</strong>
              </div>
              <p class="required-evidence">
                Required evidence: {state.case.sop.requiredEvidence}
              </p>
            </section>

            <section
              class="panel recommendation"
              aria-labelledby="recommendation-heading"
            >
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">Recommendation</p>
                  <h2 id="recommendation-heading">
                    {state.case.recommendation.title}
                  </h2>
                </div>
                <strong>{state.case.recommendation.confidencePercent}</strong>
              </div>
              <p class="recommendation-copy">
                {state.case.recommendation.recommendation}
              </p>

              <h3>Source facts</h3>
              <ul class="fact-list">
                <template
                  for:each={state.case.recommendation.facts}
                  for:item="fact"
                >
                  <li key={fact}>{fact}</li>
                </template>
              </ul>

              <h3>Model inference</h3>
              <ul class="inference-list">
                <template
                  for:each={state.case.recommendation.inferences}
                  for:item="inference"
                >
                  <li key={inference}>{inference}</li>
                </template>
              </ul>

              <dl class="model-meta">
                <div>
                  <dt>Logical profile</dt>
                  <dd>{state.case.recommendation.modelProfile}</dd>
                </div>
                <div>
                  <dt>Routing policy</dt>
                  <dd>{state.case.recommendation.policyVersion}</dd>
                </div>
              </dl>
            </section>

            <template lwc:if={showVoiceMode}>
              <section
                class="panel voice-mode"
                data-testid="voice-mode-panel"
                aria-labelledby="voice-mode-heading"
              >
                <div class="panel-heading">
                  <div>
                    <p class="section-kicker">Voice request</p>
                    <h2 id="voice-mode-heading">{voiceMode.status}</h2>
                  </div>
                </div>
                <p class="voice-summary">{voiceMode.summary}</p>
                <template lwc:if={showVoiceCaptureControls}>
                  <div
                    class="voice-capture"
                    data-testid="voice-capture-controls"
                  >
                    <lightning-button
                      label={voiceCaptureButtonLabel}
                      onclick={handleToggleVoiceCapture}
                    ></lightning-button>
                    <span>{voiceCaptureStatus}</span>
                  </div>
                </template>
                <template lwc:if={voiceTranscript}>
                  <p
                    class="voice-transcript voice-transcript_captured"
                    data-testid="voice-captured-transcript"
                  >
                    {voiceTranscript}
                  </p>
                </template>
                <template lwc:if={voiceCaptureError}>
                  <p
                    class="voice-capture-error"
                    data-testid="voice-capture-error"
                  >
                    {voiceCaptureError}
                  </p>
                </template>
                <div class="voice-request-list">
                  <template for:each={voiceMode.requests} for:item="request">
                    <article key={request.id} class="voice-card">
                      <p class="voice-transcript">{request.transcript}</p>
                      <dl class="voice-meta">
                        <div>
                          <dt>Intent</dt>
                          <dd>{request.interpretedIntent}</dd>
                        </div>
                        <div>
                          <dt>Agentforce action</dt>
                          <dd>{request.agentforceAction}</dd>
                        </div>
                        <div>
                          <dt>Status</dt>
                          <dd>{request.status}</dd>
                        </div>
                        <div>
                          <dt>Execution</dt>
                          <dd>{request.protectedActionState}</dd>
                        </div>
                      </dl>
                      <ul class="voice-fields">
                        <template
                          for:each={request.structuredFields}
                          for:item="field"
                        >
                          <li key={field.id}>
                            <span>{field.label}</span>
                            <strong>{field.value}</strong>
                          </li>
                        </template>
                      </ul>
                      <template lwc:if={request.refusal}>
                        <p
                          class="clinical-refusal"
                          data-testid="voice-clinical-refusal"
                        >
                          {request.refusal}
                        </p>
                      </template>
                    </article>
                  </template>
                </div>
              </section>
            </template>

            <section class="panel approval" aria-labelledby="approval-heading">
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">Human control</p>
                  <h2 id="approval-heading">Approval decision</h2>
                </div>
                <span class="status-pill">{state.case.approval.status}</span>
              </div>
              <p>{state.case.approval.policy}</p>
              <p class="approval-note">
                Approval authorizes execution; it does not mark the external
                action as completed.
              </p>
              <template lwc:if={showApprovalControls}>
                <div class="approval-controls" data-testid="approval-controls">
                  <template lwc:if={showRejectControl}>
                    <lightning-button
                      data-testid="reject-button"
                      label="Reject"
                      disabled={decisionPending}
                      onclick={handleReject}
                    ></lightning-button>
                  </template>
                  <template lwc:if={showModifyControl}>
                    <lightning-button
                      data-testid="modify-button"
                      label="Modify"
                      disabled={decisionPending}
                      onclick={handleModify}
                    ></lightning-button>
                  </template>
                  <template lwc:if={showApproveControl}>
                    <lightning-button
                      data-testid="approve-button"
                      label="Approve"
                      variant="brand"
                      disabled={decisionPending}
                      onclick={handleApprove}
                    ></lightning-button>
                  </template>
                </div>
              </template>
            </section>

            <section class="panel blockers" aria-labelledby="blockers-heading">
              <p class="section-kicker">Dependencies</p>
              <h2 id="blockers-heading">Current blockers</h2>
              <ul>
                <template for:each={state.case.blockers} for:item="blocker">
                  <li key={blocker.id}>
                    <div>
                      <strong>{blocker.label}</strong>
                      <span>{blocker.owner}</span>
                    </div>
                    <span>{blocker.status}</span>
                  </li>
                </template>
              </ul>
            </section>
          </aside>
        </div>
      </div>
    </template>
  </article>
</template>
